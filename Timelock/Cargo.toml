[package]
name = "timelock"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
tlock = "=0.0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Stripping the build-time helpers (proc macros) makes files that macOS 27 refuses to load.
[profile.release.build-override]
strip = false
